<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <style>
        :root {
            --fg: #1a1a1a;
            --muted: #5c5c5c;
            --border: #e4e4e4;
            --link: #005bb5;
            --bg: #fff;
            --code: #f3f3f3;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #e8e8e8;
                --muted: #a0a0a0;
                --border: #333;
                --link: #7eb6ff;
                --bg: #141414;
                --code: #242424;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 820px;
            margin: 1.25rem auto 2rem;
            padding: 0 1rem;
            line-height: 1.45;
            color: var(--fg);
            background: var(--bg);
        }

        header {
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 650;
            letter-spacing: -0.02em;
        }

        .pr-note {
            margin: 0.25rem 0 0;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .pr-note a {
            color: var(--link);
            text-decoration: none;
        }

        .pr-note a:hover {
            text-decoration: underline;
        }

        .demo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .demo-item {
            display: grid;
            grid-template-columns: 12.5rem 1fr;
            gap: 0.1rem 1.25rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            align-items: baseline;
        }

        .demo-item:last-child {
            border-bottom: none;
        }

        .demo-title {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .demo-title a {
            color: var(--link);
            text-decoration: none;
        }

        .demo-title a:hover {
            text-decoration: underline;
        }

        .demo-meta {
            min-width: 0;
        }

        .demo-description {
            margin: 0;
            font-size: 0.88rem;
            color: var(--muted);
        }

            .demo-args {
            display: block;
            margin: 0.15rem 0 0;
            padding: 0;
            font-family: ui-monospace, 'Menlo', 'Monaco', 'Ubuntu Mono', monospace;
            font-size: 0.72rem;
            line-height: 1.35;
            color: var(--muted);
            background: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer {
            margin-top: 1.25rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
            font-size: 0.82rem;
            color: var(--muted);
        }

        .footer p {
            margin: 0;
        }

        .footer a {
            color: var(--link);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .demo-item {
                grid-template-columns: 1fr;
                gap: 0.15rem;
                padding: 0.65rem 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>{{.Title}}</h1>
        {{if .PRNumber}}
        <p class="pr-note">Preview for <a href="{{if .PRUrl}}{{.PRUrl}}{{else}}https://github.com/joshbeard/web-indexer/pull/{{.PRNumber}}{{end}}" target="_blank" rel="noopener">pull request #{{.PRNumber}}</a></p>
        {{end}}
    </header>

    <ul class="demo-list">
        {{range .Demos}}
        <li class="demo-item">
            <h3 class="demo-title">
                <a href="{{.Directory}}/">{{.Title}}</a>
            </h3>
            <div class="demo-meta">
                <p class="demo-description">{{.Description}}</p>
                <code class="demo-args" title="web-indexer {{.Args}}">web-indexer {{.Args}}</code>
            </div>
        </li>
        {{end}}
    </ul>

    <div class="footer">
        <p><a href="https://github.com/joshbeard/web-indexer" target="_blank">View on GitHub</a></p>
    </div>
</body>
</html>
